<button onclick="connectToRpiMG()">Send to RPI MG</button>
<button onclick="connectToRpiChip()">Send to RPI Chip</button>
<button onclick="callclamp()">Send to Clamp</button>

<pre id="resultLog" style="border:1px solid #ccc; padding:10px; max-height:300px; overflow:auto;"></pre>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function logMessage(message) {
  const logArea = document.getElementById("resultLog");
  if (logArea) {
    const timestamp = new Date().toLocaleTimeString();
    logArea.textContent += `[${timestamp}] ${message}\n`;
    logArea.scrollTop = logArea.scrollHeight;
  } else {
    console.log(message);
  }
}

function connectToRpiMG() {
  const ip = "192.168.0.20";
  const wsMG = new WebSocket(`ws://${ip}:8080`);

  wsMG.onopen = () => {
    logMessage(`✅ Connected to RPI MG (${ip})`);
    Swal.fire("Connected", `Connected to Raspberry Pi MG (${ip})`, "success");

    const commands = [
      { Item: "Carrier 1", Message: "Move In" },
      { Item: "Carrier 1", Message: "Move Out" },
      { Item: "P&P", Message: "Move to Area 1" },
      { Item: "P&P", Message: "Move Down" },
      { Item: "P&P", Message: "Turn Vacuum ON" },
      { Item: "P&P", Message: "Move Up" },
      { Item: "P&P", Message: "Move to Area 2" },
      { Item: "P&P", Message: "Move Down" },
      { Item: "P&P", Message: "Turn Vacuum OFF" },
      { Item: "P&P", Message: "Move Up" }
    ];

    let delay = 0;

    commands.forEach((cmd, index) => {
      setTimeout(() => {
        const payload = { RPI: 20, Information: [cmd] };
        wsMG.send(JSON.stringify(payload));
        logMessage("📤 Sent:\n" + JSON.stringify(payload, null, 2));

        if (index === commands.length - 1) {
          Swal.fire("Success", "All MG commands sent to Raspberry Pi", "success");
        }
      }, delay);
      delay += 2000;
    });
  };

  wsMG.onmessage = (event) => {
    logMessage("📥 MG Response:\n" + event.data);
  };

  wsMG.onerror = (error) => {
    logMessage("❌ MG WebSocket error: " + (error.message || error));
    Swal.fire("Error", "WebSocket error for MG", "error");
  };

  wsMG.onclose = () => {
    logMessage(`🔌 MG WebSocket connection closed.`);
  };
}

</script>
