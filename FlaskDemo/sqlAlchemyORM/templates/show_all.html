<!doctype html>
<html>
<head>

  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='/css/bootstrap.css') }}">
  <title>All Students</title>
</head>
<body class="container mt-5">
  <h1 class="mb-4">All Students</h1>

  <a href="{{ url_for('new') }}" class="btn btn-primary mb-3">Add New Student</a>

  <table class="table table-hover table-bordered">
  <thead class="table-dark">
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Age</th>
      <th scope="col">Gender</th>
      <th scope="col">Actions</th> <!-- Add Actions column -->
    </tr>
  </thead>
  <tbody>
    {% for student in students %}
    <tr>
      <th scope="row">{{ loop.index }}</th>
      <td>{{ student.name }}</td>
      <td>{{ student.age }}</td>
      <td>{{ student.gender }}</td>
      <td>
        <!-- Edit/Delete buttons inside the same row -->
        <a href="{{ url_for('edit_student', id=student.id) }}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{{ url_for('delete_student', id=student.id) }}" class="btn btn-sm btn-danger"
           onclick="return confirm('Are you sure you want to delete this student?');">Delete</a>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5" class="text-center text-muted">No students found</td>
    </tr>
    {% endfor %}
  </tbody>
</table>


</body>
</html>
