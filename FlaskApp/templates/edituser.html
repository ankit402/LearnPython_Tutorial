<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit User</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .register-container {
      background-color: #fff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .register-container:hover {
      transform: scale(1.02);
    }

    h2 {
      margin-bottom: 20px;
      color: #2575fc;
    }

    input[type="text"], input[type="password"]  , input[type="email"]{
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #2575fc;
      box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2575fc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .footer-text {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
    }

    .flash-message {
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="register-container">
  <h2>Edit User</h2>
  <form action="{{ url_for('myroute.register') }}" method="get">
      <input type="text" value="{{userdata.age}}" placeholder="Enter age" required>
      <input type="email" value="{{userdata.email}}" placeholder="Enter email" required>
       <input type="text" value="{{userdata.phone}}" placeholder="Enter phone" required>
        <select name="gender" class="form-select" required>
        <option disabled>Select Gender</option>
        <option value="Male"   {% if userdata.gender == "Male" %}selected{% endif %}>Male</option>
        <option value="Female" {% if userdata.gender == "Female" %}selected{% endif %}>Female</option>
        <option value="Other"  {% if userdata.gender == "Other" %}selected{% endif %}>Other</option>
      </select>
    <button type="submit">Update</button>
  </form>

  <div class="footer-text"><a href="{{ url_for('myroute.login') }}">Go back to home</a>
  </div>
</div>

<!-- Bootstrap 5 JS Bundle CDN -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
