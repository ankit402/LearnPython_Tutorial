<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}My Website{% endblock %}</title>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            padding-top: 70px;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .welcome-card {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .welcome-card h3 {
            margin-bottom: 15px;
            color: #007bff;
        }
        .btn-logout {
            margin-left: 10px;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f8f9fa;
            padding-top: 70px;
        }
        .navbar-brand {
            font-weight: bold;
        }
        .welcome-card {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .welcome-card h3 {
            margin-bottom: 15px;
            color: #007bff;
        }
        .table-container {
            max-width: 500px;
            margin: 30px auto;
        }
        .change-password-card {
            max-width: 400px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .btn-logout {
            margin-left: 10px;
        }
        .change-password-card a {
            text-decoration: none;
            font-weight: 500;
        }
        .change-password-card a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-sm navbar-dark bg-primary fixed-top shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="#">My App</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarColor01" aria-controls="navbarColor01"
                aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarColor01">
          <ul class="navbar-nav me-auto mb-1 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="{{ url_for('myroute.home') }}">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{ url_for('myroute.GroupManagement') }}">Manage Group</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>
          </ul>
        <a href="{{ url_for('myroute.changepassword', username=session['username']) }}"
           class="btn btn-light text-primary btn-sm px-2">
            Change Password</a>
          <a href="{{ url_for('myroute.logout') }}"
             class="btn btn-light text-primary btn-sm btn-logout">Logout</a>
        </div>
      </div>
    </nav>

    <!-- Main Page Content -->
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
