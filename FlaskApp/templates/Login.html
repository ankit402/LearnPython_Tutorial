<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Login</title>

  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0072ff, #00c6ff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .login-container {
      background-color: #fff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .login-container:hover { transform: scale(1.02); }
    h2 { margin-bottom: 20px; color: #0072ff; }
    table { margin: 0 auto; border-collapse: collapse; width: 100%; }
    th { text-align: left; padding: 10px 0; color: #333; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
      font-size: 14px; outline: none; transition: 0.3s;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #0072ff; box-shadow: 0 0 5px rgba(0,114,255,0.5);
    }
    button {
      width: 100%; padding: 12px; background-color: #0072ff; border: none;
      color: white; font-size: 16px; border-radius: 8px; cursor: pointer; margin-top: 15px;
      transition: 0.3s;
    }
    button:hover { background-color: #005ace; }
    .footer-text { margin-top: 15px; font-size: 12px; color: #666; }
    .flash-message { margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="login-container">
  <h2>Application Login</h2>

  <!-- Flash Messages (show only first) -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% set category, message = messages[0] %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endif %}
  {% endwith %}

  <form action="{{ url_for('myroute.login') }}" method="post">
    <table>
      <tr><th><label for="username">Username</label></th></tr>
      <tr><th><input type="text" id="username" name="username" placeholder="Enter your username" required></th></tr>
      <tr><th><label for="password">Password</label></th></tr>
      <tr><th><input type="password" id="password" name="password" placeholder="Enter your password" required></th></tr>
      <tr><th><button type="submit">Login</button></th></tr>
    </table>
  </form>
    <div class="footer-text">
    No account? <a href="{{ url_for('myroute.register') }}">Register here</a>

      </div>

  <div class="footer-text">© 2025 Flask Application</div>
</div>

<!-- Bootstrap 5 JS Bundle CDN (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
