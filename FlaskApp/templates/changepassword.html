<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Change Password</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
  <style>
    body {
      background-color: #f8f9fa;
      padding-top: 70px;
    }
    .password-card {
      max-width: 500px;
      margin: 50px auto;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      padding: 30px 40px;
    }
    .password-card h4 {
      color: #007bff;
      font-weight: bold;
      margin-bottom: 25px;
      text-align: center;
    }
    .form-label {
      font-weight: 500;
    }
    .btn-primary {
      width: 100%;
      font-weight: 600;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-sm navbar-dark bg-primary fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">My App</a>
    <div>
      <a href="{{ url_for('myroute.home') }}" class="btn btn-light btn-sm me-2">Home</a>
      <a href="{{ url_for('myroute.logout') }}" class="btn btn-danger btn-sm">Logout</a>
    </div>
  </div>
</nav>

<!-- Flash Messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="container mt-4">
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}

<!-- Change Password Form -->
<div class="password-card">
  <h4>🔒 Change Password</h4>
  <form action="{{ url_for('myroute.changepassword', username=session['username']) }}" method="POST">

    <div class="mb-3">
      <label class="form-label">Requested Username</label>
      <input type="text" class="form-control" value="{{ session['username'] }}" readonly>
    </div>

    <div class="mb-3">
      <label for="current_password" class="form-label">Current Password</label>
      <input type="password" id="current_password" name="current_password" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="new_password" class="form-label">New Password</label>
      <input type="password" id="new_password" name="new_password" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="confirm_password" class="form-label">Confirm New Password</label>
      <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary mt-3">Update Password</button>
  </form>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
