<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .register-container {
      background-color: #fff;
      padding: 40px 50px;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .register-container:hover {
      transform: scale(1.02);
    }

    h2 {
      margin-bottom: 20px;
      color: #2575fc;
    }

    input[type="text"], input[type="password"]  , input[type="email"]{
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      outline: none;
      transition: 0.3s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #2575fc;
      box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2575fc;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #0056b3;
    }

    .footer-text {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
    }

    .flash-message {
      margin-bottom: 15px;
    }
  </style>
</head>
<!-- Navbar -->
<nav class="navbar navbar-expand-sm navbar-dark bg-primary fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">My App</a>
    <div>
      <a href="{{ url_for('myroute.home') }}" class="btn btn-light btn-sm me-2">Home</a>
      <a href="{{ url_for('myroute.logout') }}" class="btn btn-danger btn-sm">Logout</a>
    </div>
  </div>
</nav>

<body>

    <div class="password-card">
        <h4> Add Group</h4>
    <form action="{{ url_for('myroute.AddGroup', username=username) }}" method="post">
      <input type="text" name="groupname" placeholder="Enter Group Name" required>
      <input type="text" name="groupdescription" placeholder="Enter Description" required>

      <button type="submit">Save</button>
    </form></div>
</body>
</html>
